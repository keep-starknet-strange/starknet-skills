name: Full Sierra v3 Evals

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      force_quality_threshold:
        description: 'Minimum IR confirmation coverage % (0-100)'
        type: number
        default: 50
      fail_on_low_quality:
        description: 'Fail CI if below threshold'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  sierra-quality-nightly:
    name: Sierra v3 Quality Check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache scarb
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/scarb
          key: scarb-${{ runner.os }}

      - name: Install scarb
        run: |
          if ! command -v scarb &> /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://docs.swmansion.com/scarb/setup.sh | bash -s -- -i
          fi
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Run Sierra v3 signal analysis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_QUALITY_THRESHOLD: ${{ github.event.inputs.force_quality_threshold || 50 }}
          FAIL_ON_LOW_QUALITY: ${{ github.event.inputs.fail_on_low_quality || false }}
        run: |
          python scripts/quality/sierra_parallel_signal.py \
            --input evals/repo-list.json \
            --output-md outputs/sierra-v3-quality.md \
            --output-json outputs/sierra-v3-quality.json

      - name: Upload quality report
        uses: actions/upload-artifact@v4
        with:
          name: sierra-v3-quality-report
          path: outputs/sierra-v3-quality.*
          retention-days: 30

      - name: Check quality threshold
        if: github.event.inputs.fail_on_low_quality == 'true' || (github.event.schedule == '0 2 * * *' && github.event_name == 'schedule')
        env:
          THRESHOLD: ${{ github.event.inputs.force_quality_threshold || 50 }}
        run: |
          COVERAGE=$(python -c "
import json
with open('outputs/sierra-v3-quality.json') as f:
    data = json.load(f)
print(data.get('coverage_pct', 0))
")
          echo "Coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "::error::Sierra v3 coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            exit 1
          fi

  pr-sierra-auxiliary:
    name: Sierra PR Check (Auxiliary)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run lightweight Sierra check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fail-open: log results but never block PR merge
          python scripts/quality/sierra_parallel_signal.py \
            --input evals/repo-list.json \
            --output-json outputs/sierra-pr-check.json \
            || true
          echo "Sierra PR check completed (auxiliary - not blocking)"
          if [ -f outputs/sierra-pr-check.json ]; then
            python -c "
import json
with open('outputs/sierra-pr-check.json') as f:
    data = json.load(f)
print(f\"Coverage: {data.get('coverage_pct', 0)}%\")
print(f\"IR Confirmed: {data.get('ir_confirmed', 0)}\")
"
          fi

  local-audit:
    name: Local Repo Audit
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install scarb
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://docs.swmansion.com/scarb/setup.sh | bash -s -- -i
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Audit sample repo locally
        run: |
          REPO_URL="${{ github.event.inputs.sample_repo_url || 'https://github.com/keep-starknet-strange/starknet-skills' }}"
          REPO_NAME=$(basename "$REPO_URL" .git)
          git clone "$REPO_URL" /tmp/"$REPO_NAME"
          python scripts/quality/audit_local_repo.py \
            "/tmp/$REPO_NAME" \
            --output-md outputs/local-audit.md \
            --output-json outputs/local-audit.json
